# 在 GitHub 官方的 macOS 云主机上编译注入用 dylib：
#   IPATool.dylib = 悬浮面板 + 文件导入导出，SoloX.dylib = 性能悬浮窗
#
# 用法：把仓库推到 GitHub 后，Actions → Build iOS Tweaks → Run workflow，
# 跑完在 Artifacts 里下载 ipatool-tweaks（内含 *.dylib）。
# Demo IPA 的编译与注入验证已移除。
name: Build iOS Tweaks

on:
  workflow_dispatch:
    inputs:
      min_ios:
        description: 最低 iOS 版本
        required: false
        default: "14.0"
      archs:
        description: 架构（arm64e 需自行处理 ptrauth 签名）
        required: false
        default: "arm64"
  push:
    paths:
      - "tweak/**"
      - "ipatool/**"
      # demo 也在这个 workflow 里编译（Build demo IPA + 注入），改了它同样要重跑，
      # 否则 demo 的改动永远等不到构建结果
      - "demo/**"
      - "requirements.txt"
      - ".github/workflows/build-tweak.yml"

permissions:
  contents: write

# macOS 免费并发额度小、排队慢：连续导入只保留最新一次构建
concurrency:
  group: build-tweak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    # openconnect/openssl 交叉编译 10~20 分钟，排队也算进来，90 分钟封顶
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylibs
        env:
          IPATOOL_MIN_IOS: ${{ inputs.min_ios || '14.0' }}
          IPATOOL_ARCHS: ${{ inputs.archs || 'arm64' }}
          # 悬浮面板 + 文件导入导出合编成 IPATool.dylib；
          # 性能悬浮窗单独出 SoloX.dylib。
          # QNet（弱网）/ PluginLoader（运行时插件）默认不编，
          # 需要时手动改这里或在本地给 build.sh 传 IPATOOL_TARGETS。
          IPATOOL_TARGETS: IPATool SoloX
        run: |
          mkdir -p tweak/build
          chmod +x tweak/build.sh
          ./tweak/build.sh 2>&1 | tee tweak/build/_build.log
          code=${PIPESTATUS[0]}
          echo "=== build.sh exit=$code ===" | tee -a tweak/build/_build.log
          echo "=== ls -la tweak/build ===" | tee -a tweak/build/_build.log
          ls -la tweak/build 2>&1 | tee -a tweak/build/_build.log
          # 少了这一步：dylib 编译失败也会假报 success，误导排查
          exit "$code"

      - name: Verify artifacts
        run: |
          shopt -s nullglob
          files=(tweak/build/*.dylib)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有生成任何 dylib" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "=== $f"
            file "$f"
            lipo -info "$f"
            codesign -dvvv "$f" 2>&1 | head -3 || true
          done

      # 真机验证 Demo：编译最小 App，再注入面板，供实机测注入是否生效
      - name: Build demo IPA
        run: |
          chmod +x demo/build-demo.sh
          ./demo/build-demo.sh 2>&1 | tee demo-build.log
          code=${PIPESTATUS[0]}
          echo "=== build-demo.sh exit=$code ===" | tee -a demo-build.log
          exit "$code"

      - name: Inject IPATool into demo
        run: |
          python3 -m ipatool inject demo/build/IPATDemo.ipa \
            --dylib tweak/build/IPATool.dylib \
            --in-place --sign none 2>&1 | tee demo-inject.log
          code=${PIPESTATUS[0]}
          echo "=== inject exit=$code ===" | tee -a demo-inject.log
          exit "$code"

      - name: Verify demo IPA
        run: |
          python3 -m ipatool info demo/build/IPATDemo.ipa --json | head -40
          python3 -m ipatool inject demo/build/IPATDemo.ipa --list || true

      - name: Pack build directory
        run: |
          zip -r build-artifacts.zip tweak/build -x "*.DS_Store"
          unzip -l build-artifacts.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-tweaks
          path: |
            tweak/build/*.dylib
            tweak/build/_build.log
          if-no-files-found: error
          retention-days: 90

      # 单独的 demo IPA artifact：装到真机上测 VPN 连接用
      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-demo-vpn
          path: |
            demo/build/IPATDemo.ipa
            demo-build.log
            demo-inject.log
          if-no-files-found: error
          retention-days: 90

      # Release asset 可以匿名下载，Artifact 必须登录，所以额外发一份到 Release
      - name: Publish dylibs as release assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
        run: |
          assets=()
          for f in tweak/build/*.dylib; do if [ -f "$f" ]; then assets+=("$f"); fi; done
          if [ -f build-artifacts.zip ]; then assets+=(build-artifacts.zip); fi
          if [ -f demo/build/IPATDemo.ipa ]; then assets+=(demo/build/IPATDemo.ipa); fi
          if [ -f demo-build.log ]; then assets+=(demo-build.log); fi
          if [ -f demo-inject.log ]; then assets+=(demo-inject.log); fi
          if [ ${#assets[@]} -eq 0 ]; then
            echo "没有可发布的产物，跳过 Release"
            exit 0
          fi
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" \
            --notes "Actions 自动编译：run ${{ github.run_number }} / commit ${{ github.sha }}" \
            --latest=false

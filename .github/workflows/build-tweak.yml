# 在 GitHub 官方的 macOS 云主机上编译注入用 dylib（IPATool.dylib 合编 + QNet.dylib 单独出包）。
#
# 用法：把仓库推到 GitHub 后，Actions → Build iOS Tweaks → Run workflow，
# 跑完在页面底部的 Artifacts 里下载 ipatool-tweaks.zip（内含 *.dylib）。
# 之所以必须跑在 macOS runner 上：iPhoneOS SDK 与 codesign 只能在 Apple 工具链里使用，
# Linux 容器拿不到合法 SDK。
name: Build iOS Tweaks

on:
  workflow_dispatch:
    inputs:
      min_ios:
        description: 最低 iOS 版本
        required: false
        default: "14.0"
      archs:
        description: 架构（arm64e 需自行处理 ptrauth 签名）
        required: false
        default: "arm64"
  push:
    paths:
      - "tweak/**"
      - "demo/**"
      # CLI 改动靠下面那步「Inject tweaks into demo app」在 macOS runner 上验证，
      # 所以它也属于触发路径（以前改了 ipatool/ 下面什么都没有跑）
      - "ipatool/**"
      - "requirements.txt"
      - ".github/workflows/build-tweak.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build dylibs
        env:
          IPATOOL_MIN_IOS: ${{ inputs.min_ios || '14.0' }}
          IPATOOL_ARCHS: ${{ inputs.archs || 'arm64' }}
          # 悬浮窗 / 文件导入导出 / 插件加载合编成一个 IPATool.dylib；
          # 弱网测试单独出 QNet.dylib；性能悬浮窗单独出 SoloX.dylib
          IPATOOL_TARGETS: IPATool QNet SoloX
        run: |
          mkdir -p tweak/build
          chmod +x tweak/build.sh
          ./tweak/build.sh 2>&1 | tee tweak/build/_build.log
          code=${PIPESTATUS[0]}
          echo "=== build.sh exit=$code ===" | tee -a tweak/build/_build.log
          echo "=== ls -la tweak/build ===" | tee -a tweak/build/_build.log
          ls -la tweak/build 2>&1 | tee -a tweak/build/_build.log
          # 之前少了这一步：dylib 编译失败也会假报 success，误导排查
          exit "$code"

      - name: Verify artifacts
        run: |
          shopt -s nullglob
          files=(tweak/build/*.dylib)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有生成任何 dylib" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "=== $f"
            file "$f"
            lipo -info "$f"
            codesign -dvvv "$f" 2>&1 | head -3 || true
          done

      - name: Build demo app (for on-device testing)
        id: build_demo
        continue-on-error: true
        run: |
          chmod +x demo/build-demo.sh
          ./demo/build-demo.sh 2>&1 | tee demo-build.log
          exit ${PIPESTATUS[0]}

      - name: Inject tweaks into demo app
        id: inject_demo
        if: steps.build_demo.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m ipatool inject demo/build/IPATDemo.ipa \
            --files --qnet --plugins --solox --in-place --sign none 2>&1 | tee demo-inject.log
          echo "=== 注入后核对 ===" | tee -a demo-inject.log
          python3 -m ipatool inject demo/build/IPATDemo.ipa --list 2>&1 | tee -a demo-inject.log
          python3 -m ipatool info demo/build/IPATDemo.ipa 2>&1 | tee -a demo-inject.log
          ls -la demo/build 2>&1 | tee -a demo-inject.log

      - uses: actions/upload-artifact@v4
        if: steps.build_demo.outcome == 'success'
        with:
          name: ipatool-demo-ipa
          path: demo/build/IPATDemo.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Pack build directory
        if: always()
        run: |
          zip -r build-artifacts.zip tweak/build -x "*.DS_Store"
          unzip -l build-artifacts.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-tweaks
          path: |
            tweak/build/*.dylib
            tweak/build/_build.log
          if-no-files-found: error
          retention-days: 90

      # Release asset 可以匿名下载，Artifact 必须登录，所以额外发一份到 Release
      # if: always() —— 即使 Demo 编译失败也要把 dylib 和编译日志发出来，方便定位
      - name: Publish dylibs as release assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
        run: |
          assets=()
          for f in tweak/build/*.dylib; do if [ -f "$f" ]; then assets+=("$f"); fi; done
          if [ -f build-artifacts.zip ]; then assets+=(build-artifacts.zip); fi
          if [ -f demo/build/IPATDemo.ipa ]; then assets+=(demo/build/IPATDemo.ipa); fi
          if [ -f demo-build.log ]; then assets+=(demo-build.log); fi
          if [ -f demo-inject.log ]; then assets+=(demo-inject.log); fi
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" \
            --notes "Actions 自动编译：run ${{ github.run_number }} / commit ${{ github.sha }}" \
            --latest=false

name: Build AnyVpn App

on:
  push:
    paths:
      - 'AnyVpnApp/**'
      - '.github/workflows/build-vpn-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass 的 SwiftUI API 只在 iOS 26 SDK（Xcode 26 / Swift 6.2）里存在。
      # GlassStyle.swift 用 #if compiler(>=6.2) 做了隔离，旧 Xcode 也能编过，
      # 但产物只含毛玻璃分支；这里优先挑 Xcode 26，让两条分支都编进去。
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE=""
          for c in /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$c" ]; then XCODE="$c"; break; fi
          done
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          case "$SDK" in
            26.*) echo "✅ iOS 26 SDK：Liquid Glass 分支参与编译" ;;
            *)    echo "⚠️ 非 iOS 26 SDK：Liquid Glass 被 #if 隔离，产物只有毛玻璃分支" ;;
          esac

      # 静态库交叉编译要 10~20 分钟，缓存的是最终产物目录（脚本开头会检查并跳过）
      - name: Cache openconnect static libs
        uses: actions/cache@v4
        with:
          path: AnyVpnApp/Vendor/openconnect
          key: anyvpn-app-openconnect-${{ hashFiles('AnyVpnApp/scripts/build-openconnect-ios.sh') }}

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Build unsigned IPA
        run: bash AnyVpnApp/scripts/build-ipa.sh

      - name: Inspect bundle
        run: |
          find AnyVpnApp/build/Build/Products/Release-iphoneos/AnyVpnApp.app/PlugIns -maxdepth 1 -print
          file AnyVpnApp/build/Build/Products/Release-iphoneos/AnyVpnApp.app/AnyVpnApp
          file AnyVpnApp/build/Build/Products/Release-iphoneos/AnyVpnApp.app/PlugIns/PacketTunnel.appex/PacketTunnel

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AnyVpnApp-unsigned
          path: AnyVpnApp/out/AnyVpnApp-unsigned.ipa
          if-no-files-found: error

      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openconnect-build-log
          path: AnyVpnApp/.build-openconnect/build-arm64.log
          if-no-files-found: ignore

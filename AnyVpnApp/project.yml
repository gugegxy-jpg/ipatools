name: AnyVpnApp
options:
  bundleIdPrefix: com.anyvpn
  deploymentTarget:
    iOS: "15.0"   # Material / .background(_:in:) 毛玻璃材质最低 iOS 15
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_WARN_UNDECLARED_SELECTOR: YES
    # Xcode 15+ 默认 YES：自动生成的 Info.plist 会把我们手写的 NSExtension
    # 字典整个丢掉，装真机时报 IXErrorDomain Code=17
    # "extensionDictionary must be set in placeholder attributes"。
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_EXPAND_BUILD_SETTINGS: YES

targets:
  # 宿主 App：线路管理 / 凭据 / VPN 配置安装 / 日志
  AnyVpnApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "**/Info.plist"
          - "*.entitlements"
          - "**/*.entitlements"
      - path: Shared
    # 注意：不要用 XcodeGen 的 info: 块。info: 会让 XcodeGen 生成并覆盖我们手写的
    # Info.plist（UILaunchScreen / CFBundleDisplayName 会被冲掉），
    # 这里只通过 build setting 指定 INFOPLIST_FILE。
    entitlements:
      path: App/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyvpn.app
        INFOPLIST_FILE: App/Info.plist
        # 必须写到 target 级：只放 settings.base（project 级）会被覆盖
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_EXPAND_BUILD_SETTINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
        embed: true
    postBuildScripts:
      # App 的 Info.plist 若丢了 UILaunchScreen，iOS 会用 3.5 寸兼容模式跑，
      # 屏幕上下留黑块。这里兜底补齐（签名之前执行，不影响签名）。
      - name: Ensure launch screen in app Info.plist
        basedOnDependencyAnalysis: false
        script: |
          set -e
          PB=/usr/libexec/PlistBuddy
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "$PLIST" ]; then
            echo "warning: 找不到 App Info.plist: $PLIST"
            exit 0
          fi
          if ! "$PB" -c "Print :UILaunchScreen" "$PLIST" >/dev/null 2>&1; then
            "$PB" -c "Add :UILaunchScreen dict" "$PLIST"
            echo "已补齐 UILaunchScreen: $PLIST"
          fi
          if ! "$PB" -c "Print :UISupportedInterfaceOrientations" "$PLIST" >/dev/null 2>&1; then
            "$PB" -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
            "$PB" -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
            "$PB" -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
            "$PB" -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          fi
          if ! "$PB" -c "Print :CFBundleDisplayName" "$PLIST" >/dev/null 2>&1; then
            "$PB" -c "Add :CFBundleDisplayName string AnyVpn" "$PLIST"
          fi
          if ! "$PB" -c "Print :LSRequiresIPhoneOS" "$PLIST" >/dev/null 2>&1; then
            "$PB" -c "Add :LSRequiresIPhoneOS bool true" "$PLIST"
          fi

  # NetworkExtension：系统级 tun，libopenconnect 直接收发 IP 包
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes:
          - "Info.plist"
          - "**/Info.plist"
          - "*.entitlements"
          - "**/*.entitlements"
      - path: Shared
    # 同上：不用 info:，避免 XcodeGen 覆盖手写的 appex Info.plist（NSExtension 会丢）
    entitlements:
      path: Tunnel/Tunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyvpn.app.tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        # app-extension 尤其关键：自动生成的 plist 不带 NSExtension，包装得出来但装不上
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_EXPAND_BUILD_SETTINGS: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/openconnect/include"
          - "$(PROJECT_DIR)/Vendor/openconnect/include/libxml2"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/openconnect/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lopenconnect"
          - "-lssl"
          - "-lcrypto"
          - "-lxml2"
          - "-lz"
          - "-liconv"
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework

    # Xcode 26 对 app-extension 仍会用自动生成的 Info.plist 覆盖手写文件，
    # 丢掉 NSExtension 字典 → 装真机报 IXErrorDomain Code=17。
    # 在每个构建（含 Xcode 直接 Run）末尾补写，签名阶段之前执行，不影响签名。
    postBuildScripts:
      - name: Ensure NSExtension in appex Info.plist
        basedOnDependencyAnalysis: false
        script: |
          set -e
          PB=/usr/libexec/PlistBuddy
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "$PLIST" ]; then
            echo "warning: 找不到 appex Info.plist: $PLIST"
            exit 0
          fi
          if ! "$PB" -c "Print :NSExtension:NSExtensionPointIdentifier" "$PLIST" 2>/dev/null | grep -q "packet-tunnel"; then
            "$PB" -c "Delete :NSExtension" "$PLIST" 2>/dev/null || true
            "$PB" -c "Add :NSExtension dict" "$PLIST"
            "$PB" -c "Add :NSExtension:NSExtensionPointIdentifier string com.apple.networkextension.packet-tunnel" "$PLIST"
            "$PB" -c "Add :NSExtension:NSExtensionPrincipalClass string PacketTunnel.PacketTunnelProvider" "$PLIST"
            echo "已补齐 appex NSExtension 字典: $PLIST"
          fi

schemes:
  AnyVpnApp:
    build:
      targets:
        AnyVpnApp: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
